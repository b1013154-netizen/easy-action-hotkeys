name: Check and build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Core and GUI checks (without operating the host desktop)
        env:
          QT_QPA_PLATFORM: offscreen
          PYNPUT_BACKEND: dummy
        run: python -m unittest discover -s tests -v
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_windows.ps1
      - name: Build macOS
        if: runner.os == 'macOS'
        run: bash ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EasyActionHotkeys-${{ runner.os }}
          path: dist/*.zip
